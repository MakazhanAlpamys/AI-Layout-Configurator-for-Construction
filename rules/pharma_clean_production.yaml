name: Pharma-like clean production pilot
version: "0.1"
domain: pharma-clean-production
jurisdiction: project-profile-not-a-regulatory-verdict

# This is a domain policy for early design coordination. It is not GMP,
# healthcare, fire or construction-code approval.
provenance:
  source: Facility Layout Compiler product profile
  purpose: deterministic coordination evidence for a pharma-like pilot

flow_separation:
  # The current BuildingIR models separation as non-sharing of intermediate
  # rooms. It is deliberately conservative and does not claim contamination,
  # HVAC or pressure-cascade compliance.
  incompatible_flow_type_pairs:
    - [material, waste]
    - [people, waste]
    - [finished_goods, waste]
