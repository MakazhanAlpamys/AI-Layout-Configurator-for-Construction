name: Kazakhstan single-family residential — verified geometry slice
version: "2023.0-partial"
jurisdiction: KZ
extends: baseline.yaml
provenance:
  authority: Committee for Construction and Housing and Communal Services of the Ministry of Industry and Construction of the Republic of Kazakhstan
  edition: SN RK 3.02-02-2023, official edition PDF (2024 print)
  effective_date: "2023-06-16"
  source_url: https://new-shop.ksm.kz/media/egfntd/ntdgo/3_02_02_2023.pdf
  document_hash: 80db6203f81a2963033311b6bebc9616e2f05860b92cbaf67c698320f56b34da
  checked_at: "2026-08-31"

# Partial profile: directly mapped KZ requirements are layered over the generic
# design-aid baseline. Baseline thresholds remain project checks, not KZ law.
# This is not a complete Kazakhstan building-code compliance verdict.
# Source identifiers are transliterated and search keywords are translated
# into English. The exact original document is identified by its URL and hash.
rules:
  - id: GEOMETRY_VALID
    title: Layout geometry is valid
    source: LayoutIR geometry contract
    clause: internal.geometry

  - id: DAYLIGHT_OPENING
    title: Living rooms and kitchens have natural-light openings
    source: SN RK 3.02-02-2023, official edition PDF
    clause: "7.8"
    keywords: [natural lighting, windows, kitchen, bedroom, living rooms]
    params:
      require_for_needs_daylight: true
      # Project mapping for the source term translated as
      # "living rooms and kitchens (dining rooms)".
      required_room_types: [living_room, bedroom, kitchen]

  - id: FORBIDDEN_TYPE_ADJACENCY
    title: Bath-laundry blocks are not adjacent to bedrooms
    source: SN RK 3.02-02-2023, official edition PDF
    clause: "6.2.13"
    keywords: [bath-laundry block, bedroom, adjacency]
    params:
      # Project mapping for the source terms translated as "bath-laundry
      # block" and "bedrooms". Other aliases require an explicit profile update.
      source_room_types: [bath_laundry_block]
      target_room_types: [bedroom]
      minimum_shared_boundary_mm: 1

  - id: ENTRY_VESTIBULE
    title: External entry has a vestibule before a heated room
    source: SN RK 3.02-02-2023, official edition PDF
    clause: "6.2.8"
    keywords: [vestibule, external entry, heated room]
    params:
      vestibule_room_types: [vestibule, tambour, entry_lobby]

  - id: AUXILIARY_SPACE_ATTACHMENT
    title: Verandas, terraces and loggias are attached to main rooms
    source: SN RK 3.02-02-2023, official edition PDF
    clause: "6.2.12"
    keywords: [veranda, terrace, loggia, main rooms]
    params:
      # Project mapping for the source terms translated as "veranda, terrace
      # or loggia" and "main rooms of the house".
      auxiliary_room_types: [veranda, terrace, loggia]
      main_room_types: [living_room, kitchen, bedroom]
      minimum_shared_boundary_mm: 1

  - id: HEATED_ROOM_COVERAGE
    title: Required residential rooms are marked heated
    source: SN RK 3.02-02-2023, official edition PDF
    clause: "8.19"
    keywords: [heating, heated room, microclimate]
    params:
      # This is a LayoutIR declaration check, not a heating-system calculation.
      required_room_types: [living_room, bedroom, kitchen]
