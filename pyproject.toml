[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "layout-configurator"
version = "0.1.0"
description = "Deterministic floor-plan layout generator with DXF and vector PDF export"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ortools>=9.10",
  "shapely>=2.0",
  "ezdxf>=1.3",
  "reportlab>=4.0",
  "PyYAML>=6.0",
  "jsonschema>=4.20",
  "ifcopenshell>=0.8",
  "ifctester>=0.8",
]

[project.scripts]
layout-configurator = "layout_configurator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
