[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "layout-configurator"
version = "0.1.0"
description = "Solver-first facility layout compiler for regulated and industrial planning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ortools>=9.10",
  "shapely>=2.0",
  "ezdxf>=1.3",
  "reportlab>=4.0",
  "pypdf>=6.0",
  "PyYAML>=6.0",
  "jsonschema>=4.20",
  "ifcopenshell>=0.8",
  "ifctester>=0.8",
  # IfcOpenShell's runtime EXPRESS executor imports _pytest.assertion.
  "pytest>=8.0",
]

[project.scripts]
layout-configurator = "layout_configurator.cli:main"

[project.optional-dependencies]
test = ["pip>=24.0", "setuptools>=68", "wheel>=0.43"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
layout_configurator = ["static/*.html", "static/*.js", "static/*.css", "fonts/*.ttf", "fonts/*.txt", "fonts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
