# Source: this repository-owned software acceptance fixture, project brief P01.
# Room areas, widths, door sizes, route widths and equipment envelopes are explicit
# project requirements chosen for this fixture; they are not manufacturer or legal norms.
# Equipment represents coordination footprints, not a supplied product or certified system.
# Compatible categories may share a channel; every incompatible pair uses separate
# transfer rooms according to rules/hospital_pilot.yaml.
# Room coordinates are solver output. Engineering acceptance remains PENDING.
version: '0.2'
project_name: Hospital flow coordination acceptance pilot
layout:
  version: '0.1'
  project_name: Hospital flow coordination acceptance pilot
  tolerance: 0.05
  grid_mm: 100
  wall_thickness_mm: 200.0
  door_width_mm: 900.0
  window_width_mm: 1200.0
  window_height_mm: 1500.0
  window_sill_mm: 900.0
  doors: []
  windows: []
  entry_room: coordination_hub
  boundary:
    width: 20000.0
    height: 16000.0
    cutouts: []
  rooms:
  - id: coordination_hub
    type: hospital_coordination
    target_area: 48.0
    min_area: 48.0
    max_area: 48.0
    min_width: 12000.0
    min_depth: 4000.0
    required_adjacency:
    - channel_1_transfer
    - channel_2_transfer
    - channel_3_transfer
    preferred_adjacency: []
    forbidden_adjacency:
    - channel_1_source
    - channel_2_source
    - channel_3_source
    needs_daylight: false
    is_heated: false
  - id: channel_1_source
    type: patients_people_clean_supply_source
    target_area: 16.0
    min_area: 16.0
    max_area: 16.0
    min_width: 4000.0
    min_depth: 4000.0
    required_adjacency:
    - channel_1_transfer
    preferred_adjacency: []
    forbidden_adjacency:
    - coordination_hub
    needs_daylight: false
    is_heated: false
  - id: channel_1_transfer
    type: patients_people_clean_supply_transfer
    target_area: 16.0
    min_area: 16.0
    max_area: 16.0
    min_width: 4000.0
    min_depth: 4000.0
    required_adjacency:
    - channel_1_source
    - coordination_hub
    preferred_adjacency: []
    forbidden_adjacency: []
    needs_daylight: false
    is_heated: false
  - id: channel_2_source
    type: dirty_supply_source
    target_area: 16.0
    min_area: 16.0
    max_area: 16.0
    min_width: 4000.0
    min_depth: 4000.0
    required_adjacency:
    - channel_2_transfer
    preferred_adjacency: []
    forbidden_adjacency:
    - coordination_hub
    needs_daylight: false
    is_heated: false
  - id: channel_2_transfer
    type: dirty_supply_transfer
    target_area: 16.0
    min_area: 16.0
    max_area: 16.0
    min_width: 4000.0
    min_depth: 4000.0
    required_adjacency:
    - channel_2_source
    - coordination_hub
    preferred_adjacency: []
    forbidden_adjacency: []
    needs_daylight: false
    is_heated: false
  - id: channel_3_source
    type: waste_source
    target_area: 16.0
    min_area: 16.0
    max_area: 16.0
    min_width: 4000.0
    min_depth: 4000.0
    required_adjacency:
    - channel_3_transfer
    preferred_adjacency: []
    forbidden_adjacency:
    - coordination_hub
    needs_daylight: false
    is_heated: false
  - id: channel_3_transfer
    type: waste_transfer
    target_area: 16.0
    min_area: 16.0
    max_area: 16.0
    min_width: 4000.0
    min_depth: 4000.0
    required_adjacency:
    - channel_3_source
    - coordination_hub
    preferred_adjacency: []
    forbidden_adjacency: []
    needs_daylight: false
    is_heated: false
