project_name: "Two-level family house"
floor_height_mm: 2800
structural_axes_x_mm: [0, 2000, 12000]
structural_axes_y_mm: [0, 6000, 9000]
vertical_cores:
  - id: main_stair
    room_ids: [stair_0, stair_1]
    stair_width_mm: 1000
    stair_run_length_mm: 2800
floors:
  - level: 0
    layout:
      project_name: "Two-level family house / ground"
      boundary: {width: 12000, height: 9000, cutouts: []}
      grid_mm: 100
      tolerance: 0.05
      entry_room: hall_0
      rooms:
        - {id: stair_0, type: stair_core, target_area: 12, min_width: 2000, min_depth: 3000, required_adjacency: [hall_0]}
        - {id: hall_0, type: corridor, target_area: 12, min_width: 1800, min_depth: 1800, required_adjacency: [stair_0, living_0]}
        - {id: living_0, type: living_room, target_area: 24, min_width: 3000, min_depth: 3500, needs_daylight: true, is_heated: true, required_adjacency: [hall_0]}
  - level: 1
    layout:
      project_name: "Two-level family house / upper"
      boundary: {width: 12000, height: 9000, cutouts: []}
      grid_mm: 100
      tolerance: 0.05
      entry_room: hall_1
      rooms:
        - {id: stair_1, type: stair_core, target_area: 12, min_width: 2000, min_depth: 3000, required_adjacency: [hall_1]}
        - {id: hall_1, type: corridor, target_area: 12, min_width: 1800, min_depth: 1800, required_adjacency: [stair_1, bedroom_1]}
        - {id: bedroom_1, type: bedroom, target_area: 16, min_width: 2800, min_depth: 3000, needs_daylight: true, is_heated: true, required_adjacency: [hall_1]}
