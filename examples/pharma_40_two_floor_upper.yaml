# Synthetic benchmark derived from the 25-room example.
# The declared 1 m coordination grid is a solver fixture, not a structural design.
version: '0.2'
project_name: Synthetic 40-room pharma facility - upper
layout:
  version: '0.1'
  tolerance: 0.05
  grid_mm: 100
  wall_thickness_mm: 200
  door_width_mm: 900
  entry_room: stair_core
  boundary:
    width: 54000
    height: 30000
    cutouts: []
  rooms:
  - id: stair_core
    type: stair
    target_area: 24
    min_area: 20
    max_area: 30
    min_width: 4000
    min_depth: 5000
    rotatable: true
    required_adjacency:
    - upper_corridor
  - id: goods_lift
    type: goods_lift
    target_area: 16
    min_area: 12
    max_area: 20
    min_width: 3000
    min_depth: 3000
    required_adjacency:
    - sample_reception
  - id: upper_corridor
    type: corridor
    target_area: 60
    min_area: 48
    max_area: 80
    min_width: 2400
    min_depth: 14000
    rotatable: true
    required_adjacency:
    - stair_core
    - office_upper
    - meeting_room
    - qc_laboratory
    - qc_microbiology
    - hvac_plant
    - archive
    - sample_reception
  - id: sample_reception
    type: qc_sample_reception
    target_area: 24
    min_area: 18
    max_area: 32
    min_width: 4000
    min_depth: 4000
    required_adjacency:
    - goods_lift
    - upper_corridor
  - id: qc_laboratory
    type: qc_laboratory
    target_area: 90
    min_area: 75
    max_area: 110
    min_width: 7000
    min_depth: 8000
    required_adjacency:
    - upper_corridor
