    target_area: 60
    min_area: 50
    max_area: 75
    min_width: 6000
    min_depth: 7000
    required_adjacency:
    - upper_corridor
  - id: office_upper
    type: office
    target_area: 70
    min_area: 55
    max_area: 90
    min_width: 6000
    min_depth: 6000
    needs_daylight: true
    required_adjacency:
    - upper_corridor
  - id: meeting_room
    type: office
    target_area: 30
    min_area: 24
    max_area: 40
    min_width: 4500
    min_depth: 4500
    required_adjacency:
