name: Facility acceptance

on:
  # Branches are checked through their pull request; pushing to a PR branch
  # used to start a second, identical run that queued behind the first.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: facility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  api-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LAYOUT_API_TOKEN: ci-acceptance-token
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test]"
      - run: docker compose config --quiet
      - run: docker build -t layout-configurator:ci .
      - run: >-
          docker run --detach --name layout-ci-api
          --publish 127.0.0.1:8766:8766 --env LAYOUT_API_TOKEN
          layout-configurator:ci
      - name: Generate, download and independently check the pharma pilot over HTTP
        run: python scripts/api_smoke.py --output out/api-smoke/report.json
      - name: Retain service logs and stop the private service
        if: always()
        run: |
          mkdir -p out/api-smoke
          docker logs layout-ci-api > out/api-smoke/container.log 2>&1 || true
          docker stop layout-ci-api || true
      - name: Retain API acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-container-acceptance
          path: out/api-smoke/
          if-no-files-found: warn
          retention-days: 14

  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test]"
      - run: python -m unittest discover -s tests -v

  pharma-cleanroom:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test]"
      - name: Record installed dependencies
        run: |
          python -c "from pathlib import Path; Path('out/ci-acceptance').mkdir(parents=True, exist_ok=True)"
          python -VV > out/ci-acceptance/python.txt
          python -m pip list --format=json > out/ci-acceptance/dependencies.json
      - name: Generate and validate three variants for each seed
        run: >-
          python -m layout_configurator.cli acceptance-building-matrix
          examples/pharma_cleanroom_pilot.yaml
          --profile rules/pharma_cleanroom_pilot.yaml
          --output out/ci-acceptance
          --variants 3 --seeds 1 7 42 --max-attempts 9 --time-limit 30
      - name: Retain bundles and acceptance evidence, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pharma-cleanroom-acceptance
          path: out/ci-acceptance/
          if-no-files-found: warn
          retention-days: 14
