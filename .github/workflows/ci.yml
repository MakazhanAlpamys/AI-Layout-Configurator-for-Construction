name: Facility acceptance

on:
  # Branches are checked through their pull request; pushing to a PR branch
  # used to start a second, identical run that queued behind the first.
  push:
    branches: [main]
    paths-ignore: ["docs/**", "research/**", "**/*.md"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "37 1 * * 3"

permissions:
  contents: read

concurrency:
  # Cheap checkpoint pushes must not cancel a pinned full acceptance run.
  group: facility-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && 'quick' || 'full' }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  quick-contracts:
    if: github.event_name == 'push'
    name: Quick contracts and complete test collection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test]"
      - run: python -m compileall -q src scripts
      - name: Collect every test and detect import errors
        run: python -m pytest --collect-only -q
      - name: Verify exhaustive full-test shard partition without executing tests
        run: python scripts/ci_test_shards.py --verify-partition
      - name: Check source and geometry contracts
        run: >-
          python -m pytest -q
          tests/test_schema.py tests/test_building.py
          tests/test_result_geometry.py tests/test_orthogonal.py

  api-container:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LAYOUT_API_TOKEN: ci-acceptance-token
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test]"
      - run: docker compose config --quiet
      - run: docker build -t layout-configurator:ci .
      - run: >-
          docker run --detach --name layout-ci-api
          --publish 127.0.0.1:8766:8766 --env LAYOUT_API_TOKEN
          layout-configurator:ci
      - name: Generate, download and independently check the pharma pilot over HTTP
        run: python scripts/api_smoke.py --output out/api-smoke/report.json
      - name: Retain service logs and stop the private service
        if: always()
        run: |
          mkdir -p out/api-smoke
          docker logs layout-ci-api > out/api-smoke/container.log 2>&1 || true
          docker stop layout-ci-api || true
      - name: Retain API acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-container-acceptance
          path: out/api-smoke/
          if-no-files-found: warn
          retention-days: 14

  tests:
    if: github.event_name != 'push'
    name: tests (${{ matrix.os }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [core, draft-bundles]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test]"
      - name: Run the verified complete-discovery partition
        run: python scripts/ci_test_shards.py --shard ${{ matrix.shard }}
      - name: Retain shard counts, partition inventory and outcomes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-shard-${{ matrix.os }}-${{ matrix.shard }}
          path: out/ci-test-shards/*.json
          if-no-files-found: warn
          retention-days: 14

  pharma-cleanroom:
    if: github.event_name != 'push'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test]"
      - name: Record installed dependencies
        run: |
          python -c "from pathlib import Path; Path('out/ci-acceptance').mkdir(parents=True, exist_ok=True)"
          python -VV > out/ci-acceptance/python.txt
          python -m pip list --format=json > out/ci-acceptance/dependencies.json
      - name: Generate and validate three variants for each seed
        run: >-
          python -m layout_configurator.cli acceptance-building-matrix
          examples/pharma_cleanroom_pilot.yaml
          --profile rules/pharma_cleanroom_pilot.yaml
          --output out/ci-acceptance
          --variants 3 --seeds 1 7 42 --max-attempts 9 --time-limit 30
      - name: Retain bundles and acceptance evidence, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pharma-cleanroom-acceptance
          path: out/ci-acceptance/
          if-no-files-found: warn
          retention-days: 14
