name: Solver work calibration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - name: Measure repeated actual room-model responses
        run: >-
          python scripts/solver_budget_calibration.py
          examples/basic_canonical.json examples/scale_20_rooms.yaml
          --output out/solver-calibration
          --budgets .05 .1 .25 --seeds 1 7 --repetitions 2
      - name: Retain measurements including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: solver-calibration-${{ matrix.os }}
          path: out/solver-calibration/
          if-no-files-found: warn
          retention-days: 7
