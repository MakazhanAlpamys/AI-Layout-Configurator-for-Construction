name: Synthetic 80-room warm-start acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warmstart80-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  warmstart80:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install .
      - name: Generate and independently verify the source-pinned synthetic 80-room warm start
        run: >-
          python scripts/scale80_warmstart_acceptance.py
          --output out/scale80-warmstart --max-seconds 120
      - name: Retain warm-start bundles and evidence, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scale80-warmstart-acceptance
          path: out/scale80-warmstart/
          if-no-files-found: warn
          retention-days: 7
