name: Synthetic 80-room warm-start acceptance

on:
  workflow_dispatch:
    inputs:
      room_solver:
        description: Supplied warm-start room backend
        type: choice
        required: true
        default: hierarchical
        options:
          - hierarchical
          - zone_recursive
      zone_global_seconds:
        description: Recursive final global CP seconds per model
        type: choice
        required: true
        default: "2"
        options:
          - "2"
          - "5"
          - "10"
      zone_global_workers:
        description: Recursive final global CP workers
        type: choice
        required: true
        default: "1"
        options:
          - "1"
          - "2"
          - "4"
      zone_global_diagnostics:
        description: Capture bounded final recursive model and candidate diagnostics
        type: boolean
        required: false
        default: false
      zone_contact_pruning:
        description: Post bounded redundant final recursive contact no-goods
        type: boolean
        required: false
        default: false
      zone_contact_support:
        description: Couple final recursive shape choices to shared translation intervals
        type: boolean
        required: false
        default: false
      zone_selective_leaf_turns:
        description: Add bounded checked turns to eligible automatic recursive root leaves
        type: boolean
        required: false
        default: false
      zone_selective_leaf_repacking:
        description: Add two source-derived stacks to eligible automatic three-room root leaves
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: warmstart80-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  warmstart80:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install .
      - name: Generate and independently verify the source-pinned synthetic 80-room warm start
        env:
          ROOM_SOLVER: ${{ inputs.room_solver }}
          ZONE_GLOBAL_SECONDS: ${{ inputs.zone_global_seconds }}
          ZONE_GLOBAL_WORKERS: ${{ inputs.zone_global_workers }}
          ZONE_GLOBAL_DIAGNOSTICS: ${{ inputs.zone_global_diagnostics }}
          ZONE_CONTACT_PRUNING: ${{ inputs.zone_contact_pruning }}
          ZONE_CONTACT_SUPPORT: ${{ inputs.zone_contact_support }}
          ZONE_SELECTIVE_LEAF_TURNS: ${{ inputs.zone_selective_leaf_turns }}
          ZONE_SELECTIVE_LEAF_REPACKING: ${{ inputs.zone_selective_leaf_repacking }}
        shell: bash
        run: |
          args=(--output out/scale80-warmstart --max-seconds 120 --room-solver "$ROOM_SOLVER")
          if [[ "$ROOM_SOLVER" == "zone_recursive" ]]; then
            args+=(--zone-global-seconds "$ZONE_GLOBAL_SECONDS" --zone-global-workers "$ZONE_GLOBAL_WORKERS")
          fi
          if [[ "$ZONE_GLOBAL_DIAGNOSTICS" == "true" ]]; then
            args+=(--zone-global-diagnostics)
          fi
          if [[ "$ZONE_CONTACT_PRUNING" == "true" ]]; then
            args+=(--zone-contact-pruning)
          fi
          if [[ "$ZONE_CONTACT_SUPPORT" == "true" ]]; then
            args+=(--zone-contact-support)
          fi
          if [[ "$ZONE_SELECTIVE_LEAF_TURNS" == "true" ]]; then
            args+=(--zone-selective-leaf-turns)
          fi
          if [[ "$ZONE_SELECTIVE_LEAF_REPACKING" == "true" ]]; then
            args+=(--zone-selective-leaf-repacking)
          fi
          python scripts/scale80_warmstart_acceptance.py "${args[@]}"
      - name: Retain warm-start bundles and evidence, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scale80-warmstart-acceptance
          path: out/scale80-warmstart/
          if-no-files-found: warn
          retention-days: 7
