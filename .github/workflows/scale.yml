name: Scale series

# The 20/30/40-room programs take minutes and depend on the CPU they get, so
# they run weekly and on demand rather than on every push. Full seed/variant
# coverage is retained; checkpoint pushes do not launch this matrix.
on:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scale-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        program: [scale_20_rooms, scale_30_rooms, scale_40_rooms]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - name: Generate and validate two variants for each seed
        run: >-
          python -m layout_configurator.cli acceptance-building-matrix
          examples/${{ matrix.program }}.yaml
          --profile rules/pharma_cleanroom_pilot.yaml
          --output out/${{ matrix.program }}
          --variants 2 --seeds 1 7 42 --max-attempts 3 --time-limit 90
      - name: Retain bundles and evidence, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.program }}
          path: out/${{ matrix.program }}/
          if-no-files-found: warn
          retention-days: 7
  facility-floors:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 7, 42]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - name: Generate and independently verify the shared-grid 40-room stack
        run: >-
          python scripts/facility_floors_acceptance.py
          examples/pharma_40_two_floor.yaml
          --output out/pharma_40_two_floor_seed_${{ matrix.seed }}
          --seeds ${{ matrix.seed }} --variants 1 --max-attempts 3
          --time-limit 40 --minimum-rooms 40
      - name: Retain floor bundles, unified IFC and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pharma_40_two_floor_seed_${{ matrix.seed }}
          path: out/pharma_40_two_floor_seed_${{ matrix.seed }}/
          if-no-files-found: warn
          retention-days: 7
